---
name: NPM Prod Edge download proof
on:
  workflow_dispatch:
jobs:
  npm-edge-proof:
    runs-on: sonar-s
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 424febec4e550f2555cb41607e539d05727cff12
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.7.0
      - name: Configure npm with the reviewed Edge-default candidate
        uses: SonarSource/ci-github-actions/config-npm@9e4c3d9ed9f8e885a51fdbab5f779da159cd9a3c
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'
      - name: Prove a cold npm ci uses Prod Edge on the normal runner network
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          npm --version
          registry="$(npm config get registry)"
          printf 'Configured registry: %s\n' "$registry"
          printf 'replace-registry-host: %s\n' "$(npm config get replace-registry-host)"
          test "${registry%/}" = 'https://repox-internal.sonar.build/artifactory/api/npm/npm'
          export PROOF_NPM_LOG="$RUNNER_TEMP/npm-edge-http.log"
          export PROOF_REPORT="$RUNNER_TEMP/npm-edge-proof.json"
          python3 - <<'PY'
          import json
          import os
          with open('package-lock.json') as source:
              lock = json.load(source)
          urls = [p['resolved'] for p in lock['packages'].values() if 'resolved' in p]
          assert len(urls) == 322, len(urls)
          assert all(u.startswith('https://registry.npmjs.org/') for u in urls)
          print('PR lockfile: 322 canonical registry.npmjs.org tarball URLs')
          print('Runner proxy settings present: ' + json.dumps({k: bool(os.environ.get(k)) for k in ['HTTPS_PROXY', 'https_proxy', 'HTTP_PROXY', 'http_proxy', 'NO_PROXY', 'no_proxy']}))
          PY
          curl --head --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 \
            --write-out 'Unauthenticated Edge connectivity: HTTP %{http_code}, remote IP %{remote_ip}\n' \
            "$registry/semver/-/semver-7.8.5.tgz"
          rm -rf node_modules
          cache_dir="$RUNNER_TEMP/npm-edge-fresh-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$cache_dir"
          NPM_CONFIG_UPDATE_NOTIFIER=false npm ci \
            --ignore-scripts --no-audit --no-fund --loglevel=http \
            --fetch-timeout=30000 --fetch-retries=0 --cache "$cache_dir" \
            2>&1 | tee "$PROOF_NPM_LOG"
          python3 - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from urllib.parse import urlsplit
          with open(os.environ['PROOF_NPM_LOG']) as source:
              output = source.read()
          urls = re.findall(r'npm http fetch GET 200 (https://\S+)', output)
          assert urls, 'No successful HTTP downloads recorded'
          counts = Counter(urlsplit(u).hostname for u in urls)
          assert set(counts) == {'repox-internal.sonar.build'}, counts
          report = {'checkout_sha': '424febec4e550f2555cb41607e539d05727cff12',
                    'action_sha': '9e4c3d9ed9f8e885a51fdbab5f779da159cd9a3c',
                    'network_mode': 'Runner default; no diagnostic proxy',
                    'locked_canonical_urls': 322, 'fresh_cache': True,
                    'http_200_downloads_by_host': dict(counts),
                    'sample_downloads': urls[:5]}
          with open(os.environ['PROOF_REPORT'], 'w') as target:
              json.dump(report, target, indent=2)
          print('PROOF: ' + json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('## Cold npm ci through Prod Edge\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
      - name: Upload download evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-prod-edge-download-proof
          path: |
            ${{ runner.temp }}/npm-edge-http.log
            ${{ runner.temp }}/npm-edge-proof.json
          if-no-files-found: warn
