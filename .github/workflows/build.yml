---
name: Build

on:
  push:
    branches:
      - master
      - branch-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  CACHE_BACKEND: s3   # forces S3 for all cache steps, including those in reusable actions

jobs:
  build:
    runs-on:
      group: sonar-prod
      labels: sonar-s
    name: Build
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.7.0
      - name: Build, Test, Analyze and deploy
        id: build
        uses: SonarSource/ci-github-actions/build-npm@feat/hnasr/BUILD-13373-defaultRepoxSonarBuild
        env:
          SQ_SCANNER_VERSION: 4.3.0 # 4.3.1 requires node>=20
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-prod-edge
          NPM_CONFIG_LOGLEVEL: http
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader # TODO: BUILD-8639 Change to public-reader once Repox permissions for Repox are updated
          artifactory-deployer-role: qa-deployer # TODO: BUILD-8639 Change to public-deployer once Repox permissions for Repox are updated
          provenance: 'true'

  custom-command:
    needs:
      - build
    runs-on:
      group: sonar-prod
      labels: sonar-s
    name: Custom NPM command
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.7.0
      - uses: SonarSource/ci-github-actions/config-npm@feat/hnasr/BUILD-13373-defaultRepoxSonarBuild
        id: config
        with:
          artifactory-reader-role: private-reader # TODO: BUILD-8639 Change to public-reader once Repox permissions for Repox are updated
      - run: |
          echo "npm registry: $(npm config get registry)"
          echo "BUILD_NUMBER: ${{ steps.config.outputs.BUILD_NUMBER }} (from action output)"
          echo "CURRENT_VERSION: $CURRENT_VERSION (from env)"
          echo "current-version: ${{ steps.config.outputs.current-version }} (from action output)"
          echo "PROJECT_VERSION: $PROJECT_VERSION (from env)"
          echo "project-version: ${{ steps.config.outputs.project-version }} (from action output)"
          npm install
          npm test

  github-hosted-repox-sonar-build:
    runs-on: ubuntu-latest
    name: GitHub-hosted with repox.sonar.build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.7.0
      - uses: SonarSource/ci-github-actions/config-npm@feat/hnasr/BUILD-13373-defaultRepoxSonarBuild
        with:
          repox-url: https://repox.sonar.build
          artifactory-reader-role: private-reader
      - run: |
          echo "npm registry: $(npm config get registry)"
          getent hosts repox.sonar.build || true
          curl -sS -o /dev/null -w 'ping HTTP %{http_code} via %{remote_ip}\n' --max-time 60 https://repox.sonar.build/artifactory/api/system/ping
          npm ci

  report-ci-metrics:
    needs:
      - build
      - custom-command
    if: always() && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: sonar-xs
    name: Report CI metrics
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: SonarSource/ci-github-actions/report-ci-metrics@master # dogfood

  promote:
    needs:
      - build
    runs-on: sonar-s
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: SonarSource/ci-github-actions/promote@master # dogfood
